server:
  port: 8081

spring:
  application:
    name: learning-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:software_learning}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:software_learning}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:software_learning}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /software-learning
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
  flyway:
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info

python:
  knowledge:
    base-url: ${PYTHON_KNOWLEDGE_URL:http://127.0.0.1:8999}
ai:
  service:
    base-url: ${AI_SERVICE_URL:http://127.0.0.1:8082}
