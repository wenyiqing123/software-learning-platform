server:
  port: 8082
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: learning-ai-service
  ai:
    # Models are created only after ModelSettings validation, including when the key is absent.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: ${OPENAI_TEMPERATURE:0.2}
          max-tokens: ${OPENAI_MAX_TOKENS:1024}

ai:
  model:
    http-timeout: ${AI_MODEL_HTTP_TIMEOUT:30s}
  stream:
    timeout: ${AI_STREAM_TIMEOUT:120s}

python:
  knowledge:
    base-url: ${PYTHON_KNOWLEDGE_URL:http://127.0.0.1:8999}
    connect-timeout: 3s
    read-timeout: 15s
    max-response-bytes: 2097152
    max-untruncated-triples: 200

ranked:
  model:
    enabled: ${RANKED_MODEL_ENABLED:false}
    base-url: ${RANKED_MODEL_BASE_URL:http://127.0.0.1:8998/v1}
    api-key: ${RANKED_MODEL_API_KEY:}
    name: ${RANKED_MODEL_NAME:qwen35-ranked-lora}
    temperature: ${RANKED_MODEL_TEMPERATURE:0}
    max-tokens: ${RANKED_MODEL_MAX_TOKENS:512}
    http-timeout: ${RANKED_MODEL_HTTP_TIMEOUT:90s}
  matrix:
    enabled: ${RANKED_MATRIX_ENABLED:false}
    base-model-name: ${RANKED_MATRIX_BASE_MODEL_NAME:qwen35-base}

security:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
